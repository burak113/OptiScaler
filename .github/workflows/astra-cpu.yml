name: Astra portable CPU evidence
on:
  workflow_dispatch:
  push:
    branches: [sol/26-integration, sol/astra-audit-20261020]
    paths: ['research/astra20261020/**', '.github/workflows/astra-cpu.yml']
  pull_request:
    paths: ['research/astra20261020/**', '.github/workflows/astra-cpu.yml']
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r research/astra20261020/requirements.txt
      - run: python research/astra20261020/audit_round2/run_cpu.py --output /tmp/astra-cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-cpu-evidence
          path: /tmp/astra-cpu
